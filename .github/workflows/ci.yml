name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mma_manager_test

      # Side bias, decisions, archetype 45-55% bands and trait mirrors.
      - name: Fight harness
        run: npm run fight-balance

      # Ten simulated years: inbox, save size, log, world roster.
      - name: World balance harness
        run: npm run balance

      - name: Build app
        run: npm run build -w app

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Browser smoke test
        run: npm run smoke -- 4
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
